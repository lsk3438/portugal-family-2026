<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portugal Family Trip 2026</title>
<meta name="robots" content="noindex, nofollow">
<style>html,body{margin:0;height:100%;background:#0f2c44;color:#fdfbf7;font-family:Georgia,serif;display:grid;place-items:center}#ld{font-size:20px;letter-spacing:.04em;opacity:.85}</style>
</head>
<body>
<div id="ld">Chargement du voyage…</div>
<script>
(async()=>{try{
var parts=await Promise.all([0,1,2,3,4,5,6,7].map(function(i){return fetch('p'+i+'.txt',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('p'+i);return r.text()})}));
var html=parts.join('');
document.open();document.write(html);document.close();
}catch(e){document.getElementById('ld').textContent='Erreur de chargement — recharge la page.'}})();
</script>
</body>
</html>
